# ══════════════════════════════════════════════════════════════
#  Sparklin — Netlify
#  Le site PHP est pré-rendu en HTML statique pendant le build
#  (scripts/build-static.sh) ; PHP ne tourne jamais au runtime.
# ══════════════════════════════════════════════════════════════

[build]
  command = "bash scripts/build-static.sh"
  publish = "dist"
  functions = "netlify/functions"

# NOTE : les secrets Brevo/Supabase/reCAPTCHA utilisés par
# netlify/functions/*.mjs (send-contact, send-livre-blanc) doivent
# avoir le scope "Functions" + "Runtime" coché dans le dashboard
# (Site settings → Environment variables) — le scope "Builds" seul
# ne les rend pas visibles à process.env dans les Functions.

[build.environment]
  # Version PHP utilisée UNIQUEMENT pendant le build (pré-rendu),
  # jamais exposée/exécutée côté visiteur.
  PHP_VERSION = "8.2"

# ── i18n : préserve les URLs "?lang=xx" existantes (hreflang/canonical/
#    sitemap déjà construits dessus) en réécrivant en interne vers le
#    HTML pré-rendu pour cette langue, sans changer l'URL affichée. ──

[[redirects]]
  from = "/"
  query = {lang = ":lang"}
  to = "/_i18n/:lang/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  query = {lang = ":lang"}
  to = "/_i18n/:lang/:splat/index.html"
  status = 200
  force = true

# ── Admin : le JS référence login.php (identique au code source PHP) ──
[[redirects]]
  from = "/admin-blog/login.php"
  to = "/admin-blog/login.html"
  status = 200

# ── Formulaires : /api/*.php -> Netlify Functions ──
[[redirects]]
  from = "/api/send-contact.php"
  to = "/.netlify/functions/send-contact"
  status = 200

[[redirects]]
  from = "/api/send-livre-blanc.php"
  to = "/.netlify/functions/send-livre-blanc"
  status = 200

# ── 404 personnalisée (doit rester la DERNIÈRE règle) ──
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── Cache ──
#    Attention : nos assets n'ont PAS de hash dans le nom de fichier
#    (style.css, sparklin-interconnect.js…). "immutable" ne doit donc jamais
#    être utilisé ici : il dit au navigateur de ne pas revalider du tout, et
#    une mise à jour reste invisible pour les visiteurs déjà venus jusqu'à
#    expiration du max-age (7 jours auparavant, même en rechargement forcé).
#
#    CSS/JS : revalidation systématique. L'ETag renvoie un 304 vide quand rien
#    n'a changé, le coût est négligeable et un déploiement est visible tout de
#    suite.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

#    Images : un jour de cache, sans "immutable", pour qu'un remplacement de
#    fichier finisse par être repris.
#
#    Le motif est bien "/assets/images/*" et non "/assets/*" : quand plusieurs
#    règles couvrent la même URL, Netlify retient la dernière déclarée. Un
#    catch-all "/assets/*" écrasait donc les deux règles ci-dessus et servait
#    aussi le CSS et le JS en max-age=86400.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
