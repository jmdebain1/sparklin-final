name: Deploy to OVH (preprod)

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # permet de lancer le déploiement à la main depuis l'onglet Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Déploiement FTPS vers OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: preprod/sparklin/
          # Fichiers à NE PAS envoyer (et donc à ne pas supprimer côté serveur)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            .env
            **/.DS_Store
